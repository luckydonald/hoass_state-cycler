name: Python backend tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: |
          python -m pip install ruff mypy pytest pytest-asyncio pytest-cov pytest-homeassistant-custom-component homeassistant

      - name: Run backend tests (Makefile target)
        run: |
          # Ensure we run backend tests even if Makefile detection would skip
          export BACKEND=1
          make test-py
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
