name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy homeassistant

      - name: Run Ruff
        run: ruff check custom_components/

      - name: Run Ruff Format Check
        run: ruff format --check custom_components/

  python-tests:
    name: Run Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install uv & sync dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          # Use uv to sync dev dependency group declared in pyproject.toml
          python -m uv sync --dev

      - name: Install Playwright browsers
        run: |
          python -m pip install --upgrade pip
          # Ensure Playwright package is available to the same Python interpreter
          python -m pip install playwright
          python -m playwright install --with-deps
        env:
          PYTHONUNBUFFERED: 1

      - name: Run backend tests (Makefile target) including Playwright
        run: |
          # Ensure we run backend tests even if Makefile detection would skip
          export BACKEND=1
          export RUN_PLAYWRIGHT=1
          make test-py
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and activate package manager (from package.json)
        run: |
          chmod +x ./scripts/ensure_yarn.sh || true
          ./scripts/ensure_yarn.sh

      - name: Install dependencies
        working-directory: frontend
        run: |
          # If a lockfile exists, use immutable install (Yarn v4 expects this)
          if [ -f yarn.lock ] || [ -f .yarn/lock.yml ]; then
            echo "Lockfile found, running immutable install"
            yarn install --immutable
          else
            echo "No lockfile found, running regular install (will create lockfile)"
            yarn install
          fi

      - name: Type check
        working-directory: frontend
        run: yarn type-check

      - name: Build
        working-directory: frontend
        run: yarn build

  hacs-validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
