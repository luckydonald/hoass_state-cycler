[project]
name = "hoass-state-cycler"
readme = "README.md"
version = "0.0.0-pre0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
]
license = { text = "MIT" }
authors = [{ name = "luckydonald" }, { name = "luckylucy" }]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "homeassistant>=2024.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # Constrain to pre-0.13.307 releases which support Python 3.12.
    # 0.13.307 (and later) require Python>=3.13 and will break environments
    # running Python 3.12.x. Keep a range that allows earlier 0.13.x releases
    # compatible with 3.12.
    "pytest-homeassistant-custom-component>=0.13.0,<0.13.307",
    "pytest-playwright>=0.7.0",
    "playwright>=1.57.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=custom_components.state_cycler",
    "--cov-report=term-missing",
    "--cov-report=html",
]
filterwarnings = [
    "ignore:The configuration option \"asyncio_default_fixture_loop_scope\" is unset.:pytest.PytestDeprecationWarning",
]
markers = [
    "playwright: mark tests that require Playwright/browser testing",
]

[tool.coverage.run]
source = ["custom_components/state_cycler"]
omit = [
    "tests/*",
    "**/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
